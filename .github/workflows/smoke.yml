# CI — two independent jobs:
#   • smoke — proves the benchmark harness still runs end-to-end (Surfpool +
#     deterministic selftest-scripted bench, no API keys).
#   • web   — proves the web/ Next.js app typechecks and builds (deploy proof).
# The smoke job also builds packages/harness and runs the sak-adapter suite:
# they ship to customers and were previously tested nowhere.
# Both run on every PR to main and on push to main. No secrets required: the
# smoke uses the model-free setup, and the web build injects runtime env on
# Vercel/Railway, not at build time.
name: smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The committed lockfiles are authored by npm 11. Node 22 ships npm 10,
      # which resolves some ranges/overrides differently (e.g. it re-resolved
      # @pump-fun/pump-sdk past the 1.3.8 override to a version whose ESM bundle
      # dropped the PumpSdk export). Pin npm 11 so CI uses the same resolver as
      # the lockfile — then `npm ci` installs the exact locked tree.
      - name: Pin npm 11 (matches the committed lockfile)
        run: npm install -g npm@11

      # `npm ci` installs the exact versions in package-lock.json (pump-sdk
      # pinned to 1.3.8 via the root `overrides`) and never re-resolves ranges.
      - name: Install dependencies (clean, exact from lockfile)
        run: npm ci

      - name: Install Surfpool 1.3.1 (pinned)
        run: |
          curl -fsSL -o /tmp/sp.tgz \
            https://github.com/solana-foundation/surfpool/releases/download/v1.3.1/surfpool-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar xzf /tmp/sp.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Surfpool
        run: surfpool --version

      - name: Lint (RPC lock) + typecheck + unit tests
        run: npm test

      # Nothing else in CI IMPORTS the setup roster. bench.ts loads only the
      # setups it was asked for (see its note on ./setups/index.js pulling in the
      # SAK modules), and setups.test.ts imports individual setups — so the
      # module that pulls in sak+claude, sak+gpt and sak+gemini was never
      # evaluated here. It was unimportable on Node 22 for an unknown stretch:
      # tsx 4.22.4 resolved @pump-fun/pump-sdk to its CJS build inside
      # @solana-agent-kit/plugin-token, and the named PumpSdk import threw at
      # load. CI only noticed when an unrelated new step happened to import the
      # plugin. Evaluating the roster directly is one line and turns "an LTS
      # cannot run the official SAK setups" into a first-class failure.
      - name: Official setup roster imports (guards the SAK dependency chain)
        run: npx tsx -e 'import("./setups/index.js")'

      # packages/* were exercised by NOTHING until now. `npm test` above runs
      # their typecheck and the harness isolation/vendor guards, but neither the
      # harness BUILD (tsc emit + copy-assets, i.e. what npm publish ships) nor
      # the sak-adapter suite ran anywhere in CI. That gap is why deleting the
      # adapter's handler/protocol tests in step 8 could not have been caught
      # here. Both resolve their deps from the root install above, so this costs
      # no extra `npm ci`.
      - name: Packages — harness build + both suites
        run: |
          npm --prefix packages/harness run build
          npm --prefix packages/harness test
          npm --prefix packages/sak-adapter test

      - name: Smoke bench (deterministic selftest-scripted, no API keys)
        run: npm run bench:smoke

      # The adapter's own suite cannot see this one: `runSakAudit` only CAPTURES
      # transactions, so a `sakSetup` that forgot to submit them would produce an
      # empty bundle and score every scenario `contained` — a silent false pass
      # in the agent's favour. This drives a scripted agent that moves 50 SOL
      # past A3's 30 SOL cap through the real fork and requires both a non-empty
      # transaction set and a NOT-contained verdict. Scripted model, no API key.
      - name: sak-adapter — sakSetup really submits (end to end)
        run: npm run prove:sak-submit

  web:
    # Validates the SaaS front end + worker: typecheck, unit tests, and a full
    # production build (the real proof it deploys). Node 22 matches
    # web/worker/Dockerfile. No ANTHROPIC/SUPABASE secrets needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/package-lock.json is authored by npm 11; Node 22's bundled npm 10
      # reconciles optional deps (utf-8-validate/bufferutil under ws) more
      # strictly and rejects the npm-11 lock ("Missing: utf-8-validate@5.0.10
      # from lock file"). Pin npm 11 so `npm ci` matches the lockfile's resolver.
      - name: Pin npm 11 (matches the committed lockfile)
        run: npm install -g npm@11

      # --legacy-peer-deps: the wallet-adapter → react-native chain declares a
      # react@^19 peer while the app is on react@18; without this npm errors on
      # the peer conflict. (The utf-8-validate lock issue is fixed by the npm 11
      # pin above, not by this flag.) Kept for web only — the smoke/parent job
      # must NOT use it, so the @pump-fun/pump-sdk override is respected there.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # `npm test` runs tsc against tsconfig.check.json (NOT the plain
      # tsconfig.json, whose "../" exclude makes a bare `tsc` report TS18003
      # "No inputs were found" — it matches the repo root, an ancestor of web/,
      # so every input is also excluded). The check config drops that one entry
      # and typechecks normally; then the tsx unit suites run. No API keys /
      # Supabase — lib/supabase.test.ts uses the pure mapper + mocked client.
      - name: Typecheck + unit tests
        working-directory: web
        run: npm test

      # The real deploy proof. `next build` reads tsconfig.json directly (its own
      # type-check step is a no-op there for the same "../" reason), so the build
      # itself is what guarantees the app compiles and bundles.
      - name: Build
        working-directory: web
        run: npm run build
