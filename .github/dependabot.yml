version: 2
updates:
  # Root project (benchmark harness)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # The model-calling stack is exact-pinned for the pre-registered
      # benchmark (prereg §methodology): ai 4.x + @ai-sdk v1-era providers +
      # patched solana-agent-kit 2.0.10. Major bumps (e.g. ai 4→7) move to the
      # LanguageModelV2/inputSchema type surface, which the SAK setups cannot
      # compile against — those PRs fail smoke by construction (see PR #15).
      # Security fixes within the pinned majors still get PRs.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "solana-agent-kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@solana-agent-kit/*"
        update-types: ["version-update:semver-major"]

  # Web app (Next.js landing / dashboard)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Keep react + react-dom + their types in ONE coordinated PR,
      # never bumped in isolation (isolated bumps desync the runtime
      # and break the build with ReactCurrentDispatcher errors).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
